name: iOS Build

# Build-only gate. No signing, no Fastlane, no TestFlight/App Store Connect —
# those are blocked on the Apple Developer Program account not existing yet
# (see passenger-brain/agent-os/ACCOUNTS-AND-COSTS.md). This workflow's only
# job is to prove `xcodebuild build` succeeds on every push/PR to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project Passenger.xcodeproj \
            -scheme Passenger \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
